<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oathlands Analytics (private)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230f1214'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e8883a' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23e8883a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600&display=swap">
<style>
:root{--bg:#0b0d10;--card:#13171b;--fg:#e6dcc4;--mut:#9a9080;--line:#2e3436;--gold:#c9a24a;--acc:#e8883a;--bar:#e8883a;--bar2:#5f7a80;--ok:#7fa04a;--bad:#c0572b;color-scheme:dark;
--display:'Cinzel',Georgia,serif;--body:'Spectral',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe5cc;--card:#f6eed8;--fg:#2a2016;--mut:#6a5a43;--line:#c8b78f;--gold:#8a5a12;--acc:#9a3a12;--bar:#9a3a12;--bar2:#5d7377;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe5cc;--card:#f6eed8;--fg:#2a2016;--mut:#6a5a43;--line:#c8b78f;--gold:#8a5a12;--acc:#9a3a12;--bar:#9a3a12;--bar2:#5d7377;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding:16px;overflow-x:hidden}
.w{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-block:10px 18px}
h1{font:700 1.3rem var(--display);letter-spacing:.08em;margin:0}
h2{font:500 .72rem var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:500 .74rem var(--mono);letter-spacing:.06em;color:var(--fg);background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:2px}
button{cursor:pointer;text-transform:uppercase}button:hover{border-color:var(--gold);color:var(--gold)}
.gate{max-width:420px;margin:12vh auto 0;padding:28px;border:1px solid var(--line);background:var(--card)}
.gate p{color:var(--mut);margin:0 0 16px}.gate form{display:grid;gap:10px}.gate label{font:400 .74rem var(--mono);color:var(--mut);display:flex;gap:8px;align-items:center}
.err{color:var(--bad);font:400 .8rem var(--mono);min-height:1.2em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{border:1px solid var(--line);background:var(--card);padding:14px 16px}.k b{display:block;font:700 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums}.k span{font:400 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{border:1px solid var(--line);background:var(--card);padding:18px;min-width:0}.wide{grid-column:1/-1}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.95rem;margin-bottom:9px}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .v{font:500 .8rem var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:5px;background:color-mix(in srgb,var(--line) 60%,transparent)}.bar i{display:block;height:100%;background:var(--bar)}
.empty{color:var(--mut);font-style:italic}
svg{display:block;width:100%;height:auto}svg text{font:400 10px var(--mono);fill:var(--mut)}
.note{color:var(--mut);font:400 .74rem var(--mono);margin-top:20px;line-height:1.7}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
<div class="gate" id="gate"><h1>Private</h1><p>Oathlands analytics. Enter your access token to view.</p>
<form id="f"><input id="tok" type="password" autocomplete="current-password" placeholder="Access token" required aria-label="Access token"><label><input type="checkbox" id="rem"> Remember on this device</label><button type="submit">View stats</button><div class="err" id="err" role="alert"></div></form></div>
<div id="app" hidden>
<header><h1>Oathlands · Analytics</h1><div class="tools">
<select id="days" aria-label="Range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
<button id="ref" type="button">Refresh</button><button id="own" type="button"></button><button id="out" type="button">Sign out</button></div></header>
<div class="kpis" id="kpis"></div>
<div class="grid">
<div class="card wide"><h2>Views per day <small style="text-transform:none;letter-spacing:0;color:var(--mut)">(bars: views · line: visitors)</small></h2><div id="chart"></div></div>
<div class="card"><h2>Top pages</h2><div id="pages"></div></div>
<div class="card"><h2>Where visitors come from</h2><div id="refs"></div></div>
<div class="card"><h2>Countries</h2><div id="countries"></div></div>
<div class="card"><h2>Devices</h2><div id="devices"></div></div>
<div class="card"><h2>Shares</h2><div id="shares"></div></div>
<div class="card"><h2>Characters opened</h2><div id="chars"></div></div>
<div class="card wide"><h2>Reading depth (share of readers who reach each point)</h2><div id="depth"></div></div>
<div class="card wide"><h2>Busiest hours (Nepal time)</h2><div id="hours"></div></div>
</div>
<p class="note" id="note"></p>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},T=null,K='oth_admin';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(n){return Number(n||0).toLocaleString()}
function rows(box,obj,opt){box.textContent='';var a=Object.entries(obj||{}).sort(function(x,y){return y[1]-x[1]}).slice(0,opt&&opt.n||10);
 if(!a.length){box.appendChild(el('p','empty','Nothing yet.'));return}
 var max=a[0][1],tot=a.reduce(function(s,x){return s+x[1]},0);
 a.forEach(function(x){var r=el('div','row'),k=x[0];if(opt&&opt.label)k=opt.label(k);
  r.appendChild(el('div','n',k));r.appendChild(el('div','v',fmt(x[1])+(opt&&opt.pct?' · '+Math.round(x[1]/tot*100)+'%':'')));
  var b=el('div','bar'),i=el('i');i.style.width=(x[1]/max*100)+'%';b.appendChild(i);r.appendChild(b);box.appendChild(r)})}
function chart(box,s){box.textContent='';var W=1000,H=220,pl=34,pb=24,n=s.length,mx=Math.max(1,Math.max.apply(null,s.map(function(d){return d.views})));
 var ns='http://www.w3.org/2000/svg';function m(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);return e}
 var svg=m('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Daily views and visitors'});
 for(var g=0;g<=4;g++){var y=H-pb-(H-pb-10)*g/4;svg.appendChild(m('line',{x1:pl,x2:W,y1:y,y2:y,stroke:'var(--line)','stroke-width':1}));var t=m('text',{x:pl-6,y:y+3,'text-anchor':'end'});t.textContent=Math.round(mx*g/4);svg.appendChild(t)}
 var bw=(W-pl)/n,pts=[];
 s.forEach(function(d,i){var h=(H-pb-10)*d.views/mx,x=pl+i*bw;svg.appendChild(m('rect',{x:x+bw*.15,y:H-pb-h,width:bw*.7,height:Math.max(h,d.views?1:0),fill:'var(--bar)',opacity:.9}));
  pts.push((x+bw/2)+','+(H-pb-(H-pb-10)*d.visitors/mx));
  if(n<=10||i%Math.ceil(n/10)===0){var tx=m('text',{x:x+bw/2,y:H-8,'text-anchor':'middle'});tx.textContent=d.day.slice(5);svg.appendChild(tx)}
  var tt=m('title',{});tt.textContent=d.day+': '+d.views+' views, '+d.visitors+' visitors';var hit=m('rect',{x:x,y:0,width:bw,height:H-pb,fill:'transparent'});hit.appendChild(tt);svg.appendChild(hit)});
 svg.appendChild(m('polyline',{points:pts.join(' '),fill:'none',stroke:'var(--bar2)','stroke-width':2.5,'stroke-linejoin':'round'}));box.appendChild(svg)}
function hours(box,h){box.textContent='';var mx=Math.max(1,Math.max.apply(null,h)),W=1000,H=120,ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);
 var bw=W/24;h.forEach(function(v,i){var r=document.createElementNS(ns,'rect'),bh=(H-22)*v/mx;r.setAttribute('x',i*bw+bw*.12);r.setAttribute('y',H-18-bh);r.setAttribute('width',bw*.76);r.setAttribute('height',Math.max(bh,v?1:0));r.setAttribute('fill','var(--bar)');var t=document.createElementNS(ns,'title');t.textContent=i+':00 · '+v+' views';r.appendChild(t);svg.appendChild(r);
 if(i%3===0){var x=document.createElementNS(ns,'text');x.setAttribute('x',i*bw+bw/2);x.setAttribute('y',H-4);x.setAttribute('text-anchor','middle');x.textContent=i+'h';svg.appendChild(x)}});box.appendChild(svg)}
function depth(box,d,pages){box.textContent='';var ps=Object.keys(d).sort();if(!ps.length){box.appendChild(el('p','empty','No reading data yet.'));return}
 ps.forEach(function(p){var base=pages[p]||0,wrap=el('div','row'),name=el('div','n',p),vals=['25','50','75','100'].map(function(k){return (d[p][k]||0)});
  var pc=vals.map(function(v){return base?Math.min(100,Math.round(v/base*100)):0});wrap.appendChild(name);wrap.appendChild(el('div','v','of '+fmt(base)+' views'));
  var bar=el('div','bar');bar.style.height='9px';var i=el('i');i.style.width=pc[3]+'%';bar.appendChild(i);wrap.appendChild(bar);
  var det=el('div','v','25%: '+pc[0]+'% · 50%: '+pc[1]+'% · 75%: '+pc[2]+'% · finished: '+pc[3]+'%');det.style.gridColumn='1/-1';wrap.appendChild(det);box.appendChild(wrap)})}
function kpi(label,val){var k=el('div','k');k.appendChild(el('b',null,val));k.appendChild(el('span',null,label));$('kpis').appendChild(k)}
function render(d){var s=d.series,td=s[s.length-1],sh=Object.values(d.shares).reduce(function(a,b){return a+b},0),ch=Object.values(d.chars).reduce(function(a,b){return a+b},0);
 $('kpis').textContent='';kpi('Views today',fmt(td.views));kpi('Visitors today',fmt(td.visitors));kpi('Views · '+d.days+'d',fmt(d.views));kpi('Daily visitors · '+d.days+'d',fmt(d.visitors));kpi('Shares',fmt(sh));kpi('Character popups',fmt(ch));
 chart($('chart'),s);rows($('pages'),d.pages,{n:12});rows($('refs'),d.refs,{pct:1});
 var dn=null;try{dn=new Intl.DisplayNames(['en'],{type:'region'})}catch(e){}
 rows($('countries'),d.countries,{label:function(c){try{return c==='??'?'Unknown':(dn?dn.of(c)+' ('+c+')':c)}catch(e){return c}},pct:1});
 rows($('devices'),d.devices,{pct:1});rows($('shares'),d.shares);rows($('chars'),d.chars,{n:17});depth($('depth'),d.depth,d.pages);hours($('hours'),d.hours);
 $('note').textContent='Visitors are counted per day with a daily-rotating anonymous hash (no cookies, no IP stored), so the multi-day figure is the sum of each day’s unique visitors. Bots, Do Not Track browsers and your own device (if hidden) are excluded. Days use Nepal time. Updated '+new Date(d.generatedAt).toLocaleString()+'.'}
function owner(){try{return !!localStorage.getItem('oth_owner')}catch(e){return false}}
function ownLabel(){$('own').textContent=owner()?'Counting my visits: off':'Hide my visits on this device'}
function fail(m){$('gate').hidden=false;$('app').hidden=true;$('err').textContent=m}
function load(){fetch('/api/stats?days='+$('days').value,{headers:{authorization:'Bearer '+T},cache:'no-store'}).then(function(r){
  if(r.status===401){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}T=null;return fail('That token was not accepted.')}
  if(r.status===503)return fail('Analytics is not configured yet: set ADMIN_TOKEN in Netlify (see the setup note).');
  if(!r.ok)return fail('Could not load stats ('+r.status+').');
  return r.json().then(function(d){$('gate').hidden=true;$('app').hidden=false;render(d)})}).catch(function(){fail('Could not reach the stats service.')})}
function start(t,remember){T=t;try{(remember?localStorage:sessionStorage).setItem(K,t)}catch(e){}load()}
$('f').addEventListener('submit',function(e){e.preventDefault();$('err').textContent='';start($('tok').value.trim(),$('rem').checked)});
$('days').addEventListener('change',load);$('ref').addEventListener('click',load);
$('own').addEventListener('click',function(){try{owner()?localStorage.removeItem('oth_owner'):localStorage.setItem('oth_owner','1')}catch(e){}ownLabel()});
$('out').addEventListener('click',function(){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}T=null;$('tok').value='';fail('')});
ownLabel();setInterval(function(){if(T&&!document.hidden)load()},60000);
try{var s=localStorage.getItem(K)||sessionStorage.getItem(K);if(s)start(s,!!localStorage.getItem(K))}catch(e){}
})();
</script>
</body>
</html>
